@if (loadingStore.isLoading()) {
  <div
    class="pc-loading-overlay"
    role="status"
    aria-live="polite"
    [attr.aria-label]="'common.loading' | translate"
    data-testid="global-loading"
  >
    <img class="pc-loading-overlay__spinner" src="loading.gif" alt="" width="150" height="150" />
  </div>
}

<p-toast />
<p-confirmDialog />

<router-outlet />
